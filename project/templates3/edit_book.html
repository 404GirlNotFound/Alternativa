<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>App3 - urejanje</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <h1>Uredi knjigo</h1>

        <form method="post">
            <input type="text" name="title" value="{{ book['title'] }}" required>

            <input type="text" name="author" value="{{ book['author'] }}" required>

            <input type="text" name="image" value="{{ book.get('image', '') }}" placeholder="Link do slike knjige">

            <select name="status" required>
                <option value="Želim prebrati" {% if book["status"] == "Želim prebrati" %}selected{% endif %}>
                    Želim prebrati
                </option>

                <option value="Berem" {% if book["status"] == "Berem" %}selected{% endif %}>
                    Berem
                </option>

                <option value="Prebrano" {% if book["status"] == "Prebrano" %}selected{% endif %}>
                    Prebrano
                </option>
            </select>

            <select name="rating" required>
                <option value="0" {% if book["rating"] == "0" %}selected{% endif %}></option>
                <option value="1" {% if book["rating"] == "1" %}selected{% endif %}>1 ⭐</option>
                <option value="2" {% if book["rating"] == "2" %}selected{% endif %}>2 ⭐⭐</option>
                <option value="3" {% if book["rating"] == "3" %}selected{% endif %}>3 ⭐⭐⭐</option>
                <option value="4" {% if book["rating"] == "4" %}selected{% endif %}>4 ⭐⭐⭐⭐</option>
                <option value="5" {% if book["rating"] == "5" %}selected{% endif %}>5 ⭐⭐⭐⭐⭐</option>
            </select>

            <button type="submit">Shrani</button>
        </form>

        <br>

        <a href="/">Nazaj</a>

    </div>

</body>
</html>
